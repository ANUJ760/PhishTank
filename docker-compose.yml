services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gecompose}
      POSTGRES_USER: ${POSTGRES_USER:-gecompose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gecompose_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gecompose_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  gecompose_postgres:
