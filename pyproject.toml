[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gecompose"
version = "0.1.0"
description = "Deterministic scheduling engine for GeCompose using Google OR-Tools CP-SAT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.11",
    "pydantic>=2.7",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["backend*", "gecompose*"]

[tool.setuptools.package-data]
"backend.llm" = ["fixtures/*.json"]
