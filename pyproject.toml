[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gecompose"
version = "0.1.0"
description = "Deterministic scheduling engine for GeCompose using Google OR-Tools CP-SAT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.10.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
