<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="cubeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="rgba(255,255,255,0.2)" />
    </filter>
  </defs>

  <!-- Triad Icon Group (Centered around x=40, y=40, scale=0.7) -->
  <g transform="translate(4, 3) scale(0.72)">
    <!-- Connecting dashed triad lines -->
    <g stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" stroke-dasharray="2.5 2">
      <line x1="50" y1="28" x2="27" y2="68" />
      <line x1="50" y1="28" x2="73" y2="68" />
      <line x1="27" y1="68" x2="73" y2="68" />
    </g>

    <!-- Top Cube (Emerald/Teal) -->
    <g transform="translate(50, 26)" filter="url(#cubeGlow)">
      <path d="M 0 -13 L 11 -7 L 0 -1 L -11 -7 Z" fill="rgba(52, 211, 153, 0.2)" stroke="url(#emeraldGrad)" stroke-width="1.6" stroke-linejoin="round" />
      <path d="M -11 -7 L 0 -1 L 0 11 L -11 5 Z" fill="rgba(52, 211, 153, 0.12)" stroke="url(#emeraldGrad)" stroke-width="1.6" stroke-linejoin="round" />
      <path d="M 0 -1 L 11 -7 L 11 5 L 0 11 Z" fill="rgba(52, 211, 153, 0.16)" stroke="url(#emeraldGrad)" stroke-width="1.6" stroke-linejoin="round" />
      <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="#ffffff" stroke-width="1" />
      <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke="#ffffff" stroke-width="1" />
    </g>

    <!-- Bottom-Left Cube (Warm Orange) -->
    <g transform="translate(26, 68)" filter="url(#cubeGlow)">
      <path d="M 0 -13 L 11 -7 L 0 -1 L -11 -7 Z" fill="rgba(251, 146, 60, 0.2)" stroke="url(#orangeGrad)" stroke-width="1.6" stroke-linejoin="round" />
      <path d="M -11 -7 L 0 -1 L 0 11 L -11 5 Z" fill="rgba(251, 146, 60, 0.12)" stroke="url(#orangeGrad)" stroke-width="1.6" stroke-linejoin="round" />
      <path d="M 0 -1 L 11 -7 L 11 5 L 0 11 Z" fill="rgba(251, 146, 60, 0.16)" stroke="url(#orangeGrad)" stroke-width="1.6" stroke-linejoin="round" />
      <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="#ffffff" stroke-width="1" />
      <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke="#ffffff" stroke-width="1" />
    </g>

    <!-- Bottom-Right Cube (Soft Blue) -->
    <g transform="translate(74, 68)" filter="url(#cubeGlow)">
      <path d="M 0 -13 L 11 -7 L 0 -1 L -11 -7 Z" fill="rgba(129, 140, 248, 0.2)" stroke="url(#blueGrad)" stroke-width="1.6" stroke-linejoin="round" />
      <path d="M -11 -7 L 0 -1 L 0 11 L -11 5 Z" fill="rgba(129, 140, 248, 0.12)" stroke="url(#blueGrad)" stroke-width="1.6" stroke-linejoin="round" />
      <path d="M 0 -1 L 11 -7 L 11 5 L 0 11 Z" fill="rgba(129, 140, 248, 0.16)" stroke="url(#blueGrad)" stroke-width="1.6" stroke-linejoin="round" />
      <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="#ffffff" stroke-width="1" />
      <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke="#ffffff" stroke-width="1" />
    </g>
  </g>

  <!-- Wordmark "GeCompose" with Inter / Modern Sans font -->
  <text x="86" y="47" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5px" fill="#ffffff">
    Ge<tspan font-weight="400" fill="#e2e8f0">Compose</tspan>
  </text>
</svg>
