services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gecompose}
      POSTGRES_USER: ${POSTGRES_USER:-gecompose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gecompose_prod_secret}
    volumes:
      - gecompose_postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - gecompose_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      # Database
      POSTGRES_DB: ${POSTGRES_DB:-gecompose}
      POSTGRES_USER: ${POSTGRES_USER:-gecompose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gecompose_prod_secret}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-gecompose}:${POSTGRES_PASSWORD:-gecompose_prod_secret}@postgres:5432/${POSTGRES_DB:-gecompose}
      # Google Gemini API — Gemma 4 Cloud Inference
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-gemma-4-26b-a4b-it}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-You are the GeCompose AI Intelligence Assistant powered by Google Gemma 4.}
      PORT: "8000"
      # Legacy LLM config (mock mode for non-chat endpoints)
      MOCK_LLM: ${MOCK_LLM:-1}
      LLM_FALLBACK_TO_MOCK: "1"
      ALLOW_LOCAL_SANDBOX: "1"
      SANDBOX_MODE: "local"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gecompose_net
    ports:
      - "8000:8000"
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gecompose_net

volumes:
  gecompose_postgres_prod:

networks:
  gecompose_net:
    driver: bridge
